# Cloudflare Pages configuration for Delverium Guide. Optional integrations
# below stay disabled until this site's own credentials are configured.

# Cloudflare Pages configuration for local preview with Wrangler.
#
# Usage:
#   pnpm build
#   npx wrangler pages dev dist
#
# This file is optional — Cloudflare Pages auto-detects Astro when you
# connect your GitHub repo via the dashboard. Use this only for local
# preview or `wrangler pages deploy`.
#
# Reference: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "delverium-guide-live"
compatibility_date = "2026-08-11"
pages_build_output_dir = "dist"

[vars]
# Site (must include https:// protocol — Astro validates this as a URL)
SITE_URL = "https://delveriumguide.com"
# IndexNow ownership key (optional; blank = no key file / no automatic submission)
# Set the same value in GitHub Actions repository variable INDEXNOW_KEY.
INDEXNOW_KEY = ""
# Giscus comments (disabled until this site's own Discussions are configured)
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"
# Sponsor card (empty = disabled, keeps Lighthouse 4×100 out of the box)
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
# Cloudflare Web Analytics beacon token (empty = disabled)
PUBLIC_CF_BEACON_TOKEN = ""
#
# ─── Optional slots (empty = disabled) ─────────────────────────────────
# Route (A) users: fill them HERE, not in the dashboard — the dashboard UI
# is ignored while this file exists. Full reference: .env.example / docs/deployment.md
#
# Google AdSense (all 4 set = ads render at 3 positions)
#PUBLIC_ADSENSE_CLIENT = ""
#PUBLIC_ADSENSE_SLOT_STICKY = ""
#PUBLIC_ADSENSE_SLOT_SIDEBAR = ""
#PUBLIC_ADSENSE_SLOT_INCONTENT = ""
# Adsterra (disabled) — each slot needs a matching
# public/ads/<name>.html holding the unit's snippet (docs/ads.md 「广告位怎么挂」).
# 160x300 = 手册页目录下粘性位+右侧页边; 160x600 = 手册页左右页边竖幅(≥1700px 视口);
# sidebar-300x250 已建未挂载(唯一挂载点 WikiSidebar 在文章页恒 compact 不渲染广告,与
# AdSense SidebarAd 同门,挂载权留给站长); sticky-320x50 = 文章页移动端底部锚位
# (MobileAnchorAd,可一键关闭/零 CLS/同意后才加载;顶部 sticky 仍排除,StickyBanner 注释)。
PUBLIC_ADSTERRA_SLOT_SIDEBAR_300X250 = ""
PUBLIC_ADSTERRA_SLOT_INCONTENT_728X90 = ""
PUBLIC_ADSTERRA_SLOT_NATIVE_BANNER = ""
PUBLIC_ADSTERRA_SLOT_SIDEBAR_160X300 = ""
PUBLIC_ADSTERRA_SLOT_SIDEBAR_160X600 = ""
PUBLIC_ADSTERRA_SLOT_STICKY_320X50 = ""
# Google Analytics (consent-gated — loads only after the visitor accepts)
PUBLIC_GA_ID = ""
# Google Search Console verification meta token
#PUBLIC_GSC_VERIFICATION = ""
